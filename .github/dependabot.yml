version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /apps/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gomod-major:
        patterns:
          - "*"
        update-types:
          - major
