name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t lint -t build -t test --parallel=3

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/backend"
          version="${GITHUB_REF_NAME#v}"
          sha_tag="sha-${GITHUB_SHA::12}"

          tags=(
            "-t" "${image}:${version}"
            "-t" "${image}:${GITHUB_REF_NAME}"
            "-t" "${image}:${sha_tag}"
          )

          if [[ "${version}" != *-* ]]; then
            tags+=("-t" "${image}:latest")
          fi

          docker build "${tags[@]}" -f apps/backend/Dockerfile apps/backend

          docker push "${image}:${version}"
          docker push "${image}:${GITHUB_REF_NAME}"
          docker push "${image}:${sha_tag}"

          if [[ "${version}" != *-* ]]; then
            docker push "${image}:latest"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
