services:
  postgres:
    image: postgres:17
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vyft
    volumes:
      - postgres_data:/var/lib/postgresql/data

  k3s-seed:
    image: alpine:3
    restart: "no"
    volumes:
      - ./k3s/manifests:/src:ro
      - k3s_server:/dst
    command: >-
      sh -c "mkdir -p /dst/server/manifests && cp -f /src/*.yaml /dst/server/manifests/"

  k3s:
    image: rancher/k3s:v1.31.4-k3s1
    command: server --tls-san=k3s --write-kubeconfig-mode=666 --flannel-backend=host-gw
    privileged: true
    restart: unless-stopped
    ports:
      - 6443:6443
    environment:
      K3S_TOKEN: vyftdev
      K3S_KUBECONFIG_OUTPUT: /output/config
      K3S_KUBECONFIG_MODE: "666"
    # IPv6 isn't routed out on most dev hosts. Pod traffic that resolves
    # to AAAA first ("no route to host" on docker.io / GitHub Pages) is
    # what fails helm-install jobs on fresh clusters — disabling IPv6 in
    # this container forces v4 lookups all the way through CNI.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    volumes:
      - k3s_server:/var/lib/rancher/k3s
      - ./.kube:/output
    tmpfs:
      - /run
      - /var/run
    depends_on:
      k3s-seed:
        condition: service_completed_successfully

volumes:
  postgres_data: {}
  k3s_server: {}
