fullnameOverride: kps
grafana:
  enabled: false
prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 24h
    scrapeInterval: 5s
    evaluationInterval: 5s
    # Scrape every Pod/ServiceMonitor, not just release-labeled ones — lets
    # operator-created monitors (e.g. CloudNativePG's per-cluster PodMonitor)
    # be picked up without injecting a release label.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    enableFeatures:
      - otlp-write-receiver
    otlp:
      promoteResourceAttributes:
        - service.name
        - service.namespace
        - service.instance.id
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.container.name
        - k8s.deployment.name
        - k8s.node.name
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
alertmanager:
  enabled: false
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  tls:
    enabled: false
