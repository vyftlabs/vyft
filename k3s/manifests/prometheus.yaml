apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kube-prometheus-stack
  namespace: kube-system
spec:
  chart: kube-prometheus-stack
  repo: https://prometheus-community.github.io/helm-charts
  version: 65.5.0
  targetNamespace: observability
  createNamespace: true
  valuesContent: |-
    fullnameOverride: kps
    grafana:
      enabled: true
      adminPassword: admin
      service:
        type: ClusterIP
    prometheus:
      prometheusSpec:
        retention: 24h
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
    alertmanager:
      enabled: false
    prometheusOperator:
      admissionWebhooks:
        enabled: false
        patch:
          enabled: false
      tls:
        enabled: false
