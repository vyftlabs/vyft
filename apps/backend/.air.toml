root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/backend ./cmd/backend"
bin = "./tmp/backend"
delay = 1000
exclude_dir = ["tmp", ".git"]
include_ext = ["go", "tpl", "tmpl", "html", "sql"]
kill_delay = "500ms"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
