Deployments:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      vyft.dev/project: demo
      vyft.dev/resource: api
    name: api
    namespace: ""
  spec:
    replicas: 2
    selector:
      matchLabels:
        vyft.dev/project: demo
        vyft.dev/resource: api
    template:
      metadata:
        labels:
          vyft.dev/project: demo
          vyft.dev/resource: api
      spec:
        containers:
        - env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                key: DATABASE_URL
                name: api-env
          - name: LOG_LEVEL
            value: info
          image: myreg.io/api:1.0
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          name: api
          ports:
          - containerPort: 8080
            name: http
            protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
          - mountPath: /var/lib/data
            name: data
        volumes:
        - name: data
          persistentVolumeClaim:
            claimName: api-data
Ingresses: null
PVCs:
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    labels:
      vyft.dev/project: demo
      vyft.dev/resource: api
    name: api-data
    namespace: ""
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
Secrets:
- apiVersion: v1
  kind: Secret
  metadata:
    labels:
      vyft.dev/project: demo
      vyft.dev/resource: api
    name: api-env
    namespace: ""
  stringData:
    DATABASE_URL: postgres://...
  type: Opaque
Services:
- apiVersion: v1
  kind: Service
  metadata:
    labels:
      vyft.dev/project: demo
      vyft.dev/resource: api
    name: api
    namespace: ""
  spec:
    ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
    selector:
      vyft.dev/project: demo
      vyft.dev/resource: api
    type: ClusterIP
